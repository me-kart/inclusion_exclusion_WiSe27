# ─────────────────────────────────────────────────────────────
# Einstellungen des Skripts. Ändern Sie nur die Zeilen mit ← .
# Alles andere ist fertig eingerichtet.
# ─────────────────────────────────────────────────────────────
project:
  type: website
  output-dir: docs            # die fertige Webseite landet in docs/
  render:                     # nur diese Seiten werden gebaut
    - index.qmd
    - welcome.qmd
    - part-1/*.qmd
    - sessions/*.qmd
    - "!sessions/00-overview.qmd"   # alte Übersicht, ersetzt durch index.qmd
    - 03-learning-games.qmd
    - 04-learning-check.qmd
  resources:
    - "interactions/*"        # Lernspiele werden mitkopiert
    - "fonts/*"               # Schrift Outfit (OTH), lokal eingebunden

website:
  title: "International Perspectives on Inclusion and Exclusion"   # ← Titel
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: "Welcome"
        href: welcome.qmd
      - section: "Part I – Foundations and Theoretical Approaches"
        contents:
          - section: "1. Introduction: Understanding Inclusion and Exclusion"
            href: part-1/01-00-introduction.qmd
            contents:
              - part-1/01-01-topic-and-relevance.qmd
              - part-1/01-02-significance.qmd
              - part-1/01-03-historical-development.qmd
              - part-1/01-04-key-terms.qmd
              - part-1/01-05-relational-concepts.qmd
              - part-1/01-06-dimensions.qmd
              - part-1/01-07-dynamic-processes.qmd
              - part-1/01-08-ambivalence.qmd
              - part-1/01-09-normative-foundations.qmd
              - part-1/01-10-contemporary-challenges.qmd
      - section: "Seminar Sessions"
        contents:
          - text: "Overview"
            href: index.qmd
          - section: "Block I · Global Perspectives"
            contents:
              - text: "1 · Global Inequality"
                href: sessions/01-global-inequality.qmd
              - text: "2 · Postcolonial Perspectives"
                href: sessions/02-postcolonial-decolonial.qmd
              - text: "3 · Global Justice & Human Rights"
                href: sessions/03-global-justice-human-rights.qmd
              - text: "4 · Welfare State Models"
                href: sessions/04-welfare-state-models.qmd
              - text: "5 · Migration & Citizenship"
                href: sessions/05-migration-citizenship.qmd
              - text: "6 · Environmental Justice"
                href: sessions/06-environmental-justice.qmd
          - section: "Block II · Contemporary Challenges"
            contents:
              - text: "7 · Digital Divide"
                href: sessions/07-digital-divide.qmd
              - text: "8 · AI & Algorithmic Discrimination"
                href: sessions/08-ai-algorithmic-discrimination.qmd
              - text: "9 · Polarization & Populism"
                href: sessions/09-polarization-populism.qmd
              - text: "10 · Inclusive Societies"
                href: sessions/10-inclusive-societies.qmd
      - section: "Practice"
        contents:
          - text: "Learning Games"
            href: 03-learning-games.qmd
          - text: "Learning Check"
            href: 04-learning-check.qmd
  page-footer:
    left: "© Prof. Dr. Mehmet Kart · CC BY-SA 4.0"         # ← Lizenzhinweis
    right: "Created with [Quarto](https://quarto.org)"

lang: en
toc-title: "On this page"

crossref:
  fig-title: Figure
  tbl-title: Table
  fig-prefix: Figure
  tbl-prefix: Table

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: fonts/outfit.css            # Schrift Outfit (OTH), ohne Google-Server
    number-sections: false
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    toc-expand: true
    crossrefs-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    callout-appearance: simple
    include-after-body:
      - include/iframe-hoehe.html    # Lernspiele bekommen automatisch die passende Höhe
      - include/theory-panel.html    # Theorien auf Sitzungsseiten aufklappen
