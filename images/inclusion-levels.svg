<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Outfit, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Inclusion as a political goal on three levels</title>
  <desc id="d">Three nested areas. Outer area, global level: United Nations, with the Convention on the Rights of Persons with Disabilities and the 2030 Agenda, leave no one behind. Middle area, European level: European Union, fight against poverty and social exclusion. Inner area, national and local level: laws, social services and social work.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <!-- global -->
  <rect x="20" y="20" width="960" height="520" rx="28" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="52" y="66" font-size="15" font-weight="600" fill="#64748b" letter-spacing="1.5">GLOBAL LEVEL</text>
  <text x="52" y="98" font-size="26" font-weight="700" fill="#000">United Nations</text>
  <text x="560" y="66" font-size="17" fill="#000"><tspan font-weight="700">UN CRPD</tspan> · inclusion as a human rights obligation</text>
  <text x="560" y="96" font-size="17" fill="#000"><tspan font-weight="700">2030 Agenda</tspan> · “leave no one behind”</text>
  <!-- european -->
  <rect x="90" y="135" width="820" height="370" rx="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="122" y="180" font-size="15" font-weight="600" fill="#64748b" letter-spacing="1.5">EUROPEAN LEVEL</text>
  <text x="122" y="212" font-size="26" font-weight="700" fill="#000">European Union</text>
  <text x="560" y="196" font-size="17" fill="#000">Fighting <tspan font-weight="700">poverty and</tspan></text>
  <text x="560" y="222" font-size="17" fill="#000"><tspan font-weight="700">social exclusion</tspan> as a policy goal</text>
  <!-- national/local -->
  <rect x="160" y="255" width="680" height="215" rx="20" fill="#ffffff" stroke="#008c49" stroke-width="4"/>
  <text x="192" y="300" font-size="15" font-weight="600" fill="#008c49" letter-spacing="1.5">NATIONAL AND LOCAL LEVEL</text>
  <text x="192" y="334" font-size="26" font-weight="700" fill="#000">States, municipalities, services</text>
  <text x="192" y="372" font-size="17" fill="#000">Laws · social policy · schools · social services · social work</text>
  <line x1="192" y1="398" x2="808" y2="398" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="192" y="430" font-size="17" font-style="italic" fill="#334155">Who defines what full participation means?</text>
  <text x="192" y="456" font-size="17" font-style="italic" fill="#334155">Which differences are recognised, and which are expected to disappear?</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
