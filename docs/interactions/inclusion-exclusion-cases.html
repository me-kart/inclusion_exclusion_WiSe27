<!DOCTYPE html>
<!--
  KONZEPTKARTE
  - Lernziel: Die Studierenden unterscheiden Exclusion, Segregation, Integration und Inclusion
    und wenden die Begriffe auf internationale Fälle und Rechtsrahmen an
    (EGMR, US Supreme Court, Staatsangehörigkeitsrecht, UN-BRK).
  - Fehlvorstellung: „Wer im System ist, ist inkludiert“ – Integration wird mit Inclusion
    gleichgesetzt, und Ausgrenzung gilt nur als vollständiges Draußensein.
  - Interaktionstyp: Zuordnen mit Begründung
  - Was die Lernenden tun: Sie lesen einen internationalen Fall, notieren in einem Satz das
    entscheidende Merkmal und ordnen den Fall einer von vier Kategorien zu; bei einer falschen
    Wahl versuchen sie es erneut.
  - Rückmeldung: Nach jeder Wahl erklärt ein Satz, warum diese Kategorie passt oder nicht.
  - Navigation: Mit „Previous case“ lassen sich frühere Fälle samt Begründung und Rückmeldung erneut ansehen.
  - Sprache: Oberfläche und Fälle auf Englisch.
  - Inhalte: 8 Fälle (4 reale Rechts- und Politikfälle, 4 als fiktiv gekennzeichnete Vignetten).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Perspectives on Inclusion and Exclusion: Fälle zuordnen</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px; line-height: 1.45; color: #1d1d1d; background: #ffffff;
  }
  .rahmen { max-width: 860px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  .anleitung { margin: 0 0 .8rem; font-size: .95rem; }
  .status { margin: 0 0 .6rem; font-weight: 600; font-size: .95rem; }
  .fall {
    margin: 0 0 .8rem; padding: .8rem; border: 2px solid #2f4a6d; border-radius: 6px; background: #f6f8fb;
  }
  .fall h2 { font-size: 1rem; margin: 0 0 .2rem; color: #2f4a6d; }
  .fall h2:focus { outline: none; }
  .kontext { margin: 0 0 .4rem; font-size: .85rem; font-weight: 700; color: #555; overflow-wrap: anywhere; }
  .fall-text { margin: 0; overflow-wrap: anywhere; }
  label.begr-label { display: block; font-size: .92rem; font-weight: 600; margin: 0 0 .3rem; }
  textarea {
    display: block; width: 100%; min-height: 3.6rem; margin: 0 0 .8rem; padding: .5rem;
    font: inherit; font-size: .95rem; border: 1px solid #888; border-radius: 6px; resize: vertical;
  }
  .frage { margin: 0 0 .4rem; font-size: .95rem; font-weight: 600; }
  .kategorien {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; margin: 0 0 .8rem;
  }
  .kat {
    font: inherit; font-size: .95rem; font-weight: 600; padding: .6rem .4rem; min-height: 2.8rem;
    border: 2px solid #2f4a6d; border-radius: 6px; background: #ffffff; color: #2f4a6d; cursor: pointer;
  }
  .kat.falsch { border-color: #a0522d; color: #a0522d; background: #fbf1ea; }
  .kat.falsch::before { content: "✗ "; }
  .kat.richtig { border-color: #2e6b3a; color: #ffffff; background: #2e6b3a; }
  .kat.richtig::before { content: "✓ "; }
  .kat[aria-disabled="true"] { cursor: default; }
  .rueckmeldung {
    min-height: 2.6em; margin: 0 0 .8rem; padding: .6rem .7rem;
    border-left: 4px solid #2f4a6d; background: #eef2f7; font-size: .95rem; overflow-wrap: anywhere;
  }
  .rueckmeldung.ok { border-left-color: #2e6b3a; background: #eef7f0; }
  .rueckmeldung.nein { border-left-color: #a0522d; background: #fbf1ea; }
  .knopf {
    font: inherit; font-weight: 600; padding: .55rem 1rem; border: 2px solid #2f4a6d;
    border-radius: 6px; background: #2f4a6d; color: #ffffff; cursor: pointer; margin: 0 0 1rem;
  }
  .navigation { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 1rem; }
  .navigation .knopf { margin: 0; }
  .knopf.zweit { background: #ffffff; color: #2f4a6d; }
  .knopf:disabled { border-color: #b5b5b5; color: #8a8a8a; background: #f2f2f2; cursor: default; }
  .ende { margin: 0 0 1rem; padding: .8rem; border: 2px solid #2e6b3a; border-radius: 6px; background: #f3faf4; }
  .ende h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
  .ende h2:focus { outline: none; }
  .ende p { margin: 0 0 .6rem; font-weight: 600; }
  .uebersicht { margin: 0 0 .8rem; padding-left: 1.3rem; }
  .uebersicht li { margin-bottom: .7rem; overflow-wrap: anywhere; }
  .uebersicht .ktx { display: block; font-size: .85rem; font-weight: 700; color: #555; }
  .uebersicht .loes { display: block; font-weight: 700; color: #2e6b3a; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #d9822b; outline-offset: 2px; }
  .versteckt { display: none; }
</style>
</head>
<body>
<script>
/* ===== DATEN: Nur diesen Block ändern ===== */
const DATEN = {
  titel: "International Perspectives on Inclusion and Exclusion: Classifying Cases",
  anleitung: "The cases come from different countries and legal frameworks. Read each case and first note in one sentence which feature decides your classification. Then choose the matching category. After each choice, one sentence explains why it fits or not; if your choice does not fit, try another category.",
  kategorien: [
    { id: "exclusion",   name: "Exclusion" },
    { id: "segregation", name: "Segregation" },
    { id: "integration", name: "Integration" },
    { id: "inclusion",   name: "Inclusion" }
  ],
  faelle: [
    { kontext: "Czech Republic · European Court of Human Rights, 2007",
      text: "Many Roma children in the Czech Republic were placed in \"special schools\" for pupils with learning difficulties; the European Court of Human Rights ruled on this practice in D.H. and Others v. the Czech Republic.",
      loesung: "segregation",
      erklaerungen: {
        segregation: "The children stay inside the school system but are sorted into separate institutions along ethnic lines, which the Court judged to be indirect discrimination.",
        exclusion:   "The children are not cut off from schooling altogether but taught in separate institutions, which makes this segregation rather than exclusion.",
        integration: "The children are not placed in mainstream schools at all but kept apart from them.",
        inclusion:   "The school system does not change to fit the children; it sorts them out of the mainstream."
      } },
    { kontext: "United States · Supreme Court, 1954",
      text: "Until the Supreme Court's decision in Brown v. Board of Education, many US states required by law that Black and white children attend separate public schools.",
      loesung: "segregation",
      erklaerungen: {
        segregation: "Black children were schooled within the public system but in separate institutions by law, which is segregation in its classic form.",
        exclusion:   "Black children did attend public schools, only separate ones, so they were kept apart rather than cut off.",
        integration: "The children were not placed in shared schools at all; the law kept them in separate ones.",
        inclusion:   "The system kept groups apart by law instead of adapting shared structures to all children."
      } },
    { kontext: "Myanmar · Citizenship Law, 1982",
      text: "Under Myanmar's 1982 Citizenship Law, most Rohingya were not recognised as citizens; as stateless people they lack the rights and protections that citizenship would grant.",
      loesung: "exclusion",
      erklaerungen: {
        exclusion:   "Denying citizenship cuts the Rohingya off from membership and the rights attached to it, which is exclusion at the level of the political community.",
        segregation: "The decisive feature here is the denial of membership and rights, not the placement in separate institutions.",
        integration: "Nobody is incorporated into existing structures; access to citizenship itself is refused.",
        inclusion:   "The state does not adapt its structures to enable membership; it legally withholds membership."
      } },
    { kontext: "European countries · migration regimes",
      text: "In many European countries, undocumented migrants have only very limited access to health care, no right to regular employment and no social benefits, and they avoid public institutions for fear of detection.",
      loesung: "exclusion",
      erklaerungen: {
        exclusion:   "These people are cut off from rights, resources and participation in several areas at once, which is the core of exclusion.",
        segregation: "They are not placed in a separate system or space but largely denied access to the systems themselves.",
        integration: "There is no incorporation into existing structures, since access to work, benefits and most care is denied.",
        inclusion:   "Nothing in the structures is changed to enable participation; access is blocked instead."
      } },
    { kontext: "State party to the UN CRPD · fictional case",
      text: "A pupil who uses a wheelchair attends a regular class, but teaching methods, materials and assessments stay exactly as before, and she is expected to keep up on her own.",
      loesung: "integration",
      erklaerungen: {
        integration: "The pupil is placed in mainstream structures but has to adapt to unchanged teaching, which the CRPD Committee calls integration, not inclusion (General Comment No. 4).",
        exclusion:   "The pupil does have access to the regular class, so she is not cut off; the problem is that nothing adapts to her.",
        segregation: "The pupil learns in a regular class rather than in a separate space or institution, so she is not kept apart.",
        inclusion:   "Placement alone is not enough, because teaching and materials remain unchanged and the pupil must adapt on her own."
      } },
    { kontext: "European immigration country · fictional case",
      text: "Newly arrived adults may only enter the labour market after completing a language and civics course, while employers, job centres and the recognition of foreign qualifications remain unchanged.",
      loesung: "integration",
      erklaerungen: {
        integration: "Access depends on newcomers adapting first while the institutions themselves remain unchanged, which is typical of integration.",
        exclusion:   "Access is conditional but open to newcomers who complete the course, so they are not permanently cut off.",
        segregation: "Newcomers are not kept in separate institutions; they are prepared to enter the existing labour market.",
        inclusion:   "The institutions do not change at all; only the newcomers are required to adapt."
      } },
    { kontext: "University implementing Article 24 UN CRPD · fictional case",
      text: "A university redesigns its exams, provides captioned lectures and flexible deadlines for all students, and involves disabled students in planning these changes.",
      loesung: "inclusion",
      erklaerungen: {
        inclusion:   "The institution changes its own structures for all students and involves those affected, so the system adapts to diversity.",
        exclusion:   "Nobody is cut off here; the measures widen access and participation.",
        segregation: "No group is moved into separate spaces or services; all students learn within the same structures.",
        integration: "The students are not expected to adapt to unchanged structures; the university changes its exams and teaching."
      } },
    { kontext: "Youth centre in a multilingual city · fictional case",
      text: "A youth centre rewrites its house rules together with young people of different backgrounds, publishes information in several languages and changes its opening hours so that working teenagers can attend.",
      loesung: "inclusion",
      erklaerungen: {
        inclusion:   "The centre changes its rules, information and opening hours together with young people, so its structures adapt to their diversity.",
        exclusion:   "The measures open the centre to more young people instead of cutting anyone off.",
        segregation: "Young people of different backgrounds use the same centre; no group is moved into a separate offer.",
        integration: "Young people are not expected to adapt to fixed rules; the centre adapts its own structures."
      } }
  ],
  texte: {
    fall: "Case {nr} of {gesamt}",
    status: "Case {nr} of {gesamt} · correct on first attempt: {treffer}",
    begruendungLabel: "Your reasoning in one sentence (optional, not assessed):",
    frage: "Which category fits?",
    richtig: "Correct – {kategorie}: ",
    falsch: "Not a fit – {kategorie}: ",
    nochmal: " Try another category.",
    vergleich: " Compare this explanation with your own reasoning.",
    schonGeloest: "This case is already solved; continue with “Next case”.",
    schonVersucht: "You have already ruled out this category for this case; please choose another one.",
    weiter: "Next case",
    auswertung: "See results",
    endeTitel: "Results",
    ergebnis: "You classified {treffer} of {gesamt} cases correctly on the first attempt.",
    uebersichtTitel: "All cases with solutions:",
    zurueck: "Previous case",
    zurueckZuFaellen: "Back to the cases",
    neu: "Start again",
    gestartet: "The cases have been reshuffled; you start with case 1.",
    labelRichtig: ", correct",
    labelFalsch: ", not a fit"
  }
};
/* ===== ENDE DATEN ===== */
</script>

<main class="rahmen">
  <h1 id="titel"></h1>
  <p class="anleitung" id="anleitung"></p>

  <div id="spiel">
    <p class="status" id="status"></p>
    <section class="fall">
      <h2 id="fallTitel" tabindex="-1"></h2>
      <p class="kontext" id="fallKontext" lang="en"></p>
      <p class="fall-text" id="fallText" lang="en"></p>
    </section>
    <label class="begr-label" for="begruendung" id="begrLabel"></label>
    <textarea id="begruendung" lang="en"></textarea>
    <p class="frage" id="frage"></p>
    <div class="kategorien" id="kategorien" role="group" aria-labelledby="frage"></div>
    <div class="rueckmeldung" id="rueckmeldung" role="status" aria-live="polite"></div>
    <div class="navigation">
      <button type="button" class="knopf zweit" id="zurueck"></button>
      <button type="button" class="knopf versteckt" id="weiter"></button>
    </div>
  </div>

  <section class="ende versteckt" id="ende">
    <h2 id="endeTitel" tabindex="-1"></h2>
    <p id="ergebnis"></p>
    <p id="uebersichtTitel"></p>
    <ol class="uebersicht" id="uebersicht"></ol>
    <div class="navigation">
      <button type="button" class="knopf zweit" id="zurueckEnde"></button>
      <button type="button" class="knopf" id="neu"></button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var T = DATEN.texte;
  var KATS = DATEN.kategorien;

  var el = function (id) { return document.getElementById(id); };
  var spiel = el("spiel"), ende = el("ende");
  var statusEl = el("status"), fallTitel = el("fallTitel"), fallKontext = el("fallKontext"), fallText = el("fallText");
  var begr = el("begruendung"), katBox = el("kategorien");
  var rueck = el("rueckmeldung"), weiterKnopf = el("weiter"), neuKnopf = el("neu");
  var zurueckKnopf = el("zurueck"), zurueckEndeKnopf = el("zurueckEnde");

  var reihenfolge = [], pos = 0, treffer = 0;
  var zustand = [];  /* je Fall: Versuche, gelöst, Begründung, letzte Rückmeldung */
  var katKnoepfe = {};
  var meldeTimer = null;

  document.title = DATEN.titel;
  el("titel").textContent = DATEN.titel;
  el("anleitung").textContent = DATEN.anleitung;
  el("begrLabel").textContent = T.begruendungLabel;
  el("frage").textContent = T.frage;
  el("endeTitel").textContent = T.endeTitel;
  el("uebersichtTitel").textContent = T.uebersichtTitel;
  neuKnopf.textContent = T.neu;
  zurueckKnopf.textContent = T.zurueck;
  zurueckEndeKnopf.textContent = T.zurueckZuFaellen;

  function fuelle(v, w) {
    return v.replace(/\{(\w+)\}/g, function (m, k) {
      return Object.prototype.hasOwnProperty.call(w, k) ? String(w[k]) : m;
    });
  }
  function meldeHoehe() {
    try {
      window.parent.postMessage({ typ: "iframe-hoehe", hoehe: document.documentElement.scrollHeight }, "*");
    } catch (e) { /* ohne einbettende Seite nichts zu tun */ }
  }
  function melde(text, art) {
    rueck.className = "rueckmeldung" + (art ? " " + art : "");
    rueck.textContent = "";
    if (meldeTimer) { clearTimeout(meldeTimer); }
    meldeTimer = setTimeout(function () { rueck.textContent = text; meldeHoehe(); }, 50);
  }
  function mische(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }
  function katName(id) {
    for (var i = 0; i < KATS.length; i++) { if (KATS[i].id === id) { return KATS[i].name; } }
    return id;
  }

  KATS.forEach(function (k) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "kat";
    b.lang = "en";
    b.textContent = k.name;
    b.addEventListener("click", function () { waehle(k.id); });
    katBox.appendChild(b);
    katKnoepfe[k.id] = b;
  });

  function zeigeStatus() {
    statusEl.textContent = fuelle(T.status, { nr: pos + 1, gesamt: reihenfolge.length, treffer: treffer });
  }

  function zeigeNavigation() {
    var z = zustand[pos];
    zurueckKnopf.disabled = (pos === 0);
    weiterKnopf.textContent = pos < reihenfolge.length - 1 ? T.weiter : T.auswertung;
    weiterKnopf.classList.toggle("versteckt", !z.geloest);
  }

  function zeigeFall(fokus) {
    var f = DATEN.faelle[reihenfolge[pos]];
    var z = zustand[pos];
    fallTitel.textContent = fuelle(T.fall, { nr: pos + 1, gesamt: reihenfolge.length });
    fallKontext.textContent = f.kontext || "";
    fallText.textContent = f.text;
    begr.value = z.begr;
    KATS.forEach(function (k) {
      var b = katKnoepfe[k.id];
      if (z.versuche.indexOf(k.id) === -1) {
        b.className = "kat";
        b.setAttribute("aria-label", k.name);
        if (z.geloest) { b.setAttribute("aria-disabled", "true"); } else { b.removeAttribute("aria-disabled"); }
      } else if (k.id === f.loesung) {
        b.className = "kat richtig";
        b.setAttribute("aria-disabled", "true");
        b.setAttribute("aria-label", k.name + T.labelRichtig);
      } else {
        b.className = "kat falsch";
        b.setAttribute("aria-disabled", "true");
        b.setAttribute("aria-label", k.name + T.labelFalsch);
      }
    });
    if (meldeTimer) { clearTimeout(meldeTimer); }
    rueck.className = "rueckmeldung" + (z.art ? " " + z.art : "");
    rueck.textContent = z.meldung;
    zeigeNavigation();
    zeigeStatus();
    if (fokus) { fallTitel.focus(); }
    meldeHoehe();
  }

  function waehle(id) {
    var f = DATEN.faelle[reihenfolge[pos]];
    var z = zustand[pos];
    if (z.geloest) { melde(T.schonGeloest); return; }
    if (z.versuche.indexOf(id) !== -1) { melde(T.schonVersucht); return; }
    z.versuche.push(id);
    var b = katKnoepfe[id];
    var satz = f.erklaerungen[id] || "";
    if (id === f.loesung) {
      z.geloest = true;
      if (z.versuche.length === 1) { treffer++; }
      b.className = "kat richtig";
      b.setAttribute("aria-label", katName(id) + T.labelRichtig);
      KATS.forEach(function (k) { katKnoepfe[k.id].setAttribute("aria-disabled", "true"); });
      z.meldung = fuelle(T.richtig, { kategorie: katName(id) }) + satz + (begr.value.trim() ? T.vergleich : "");
      z.art = "ok";
      melde(z.meldung, z.art);
      zeigeNavigation();
    } else {
      b.className = "kat falsch";
      b.setAttribute("aria-disabled", "true");
      b.setAttribute("aria-label", katName(id) + T.labelFalsch);
      z.meldung = fuelle(T.falsch, { kategorie: katName(id) }) + satz + T.nochmal;
      z.art = "nein";
      melde(z.meldung, z.art);
    }
    zeigeStatus();
    meldeHoehe();
  }

  function zeigeEnde() {
    spiel.classList.add("versteckt");
    ende.classList.remove("versteckt");
    el("ergebnis").textContent = fuelle(T.ergebnis, { treffer: treffer, gesamt: reihenfolge.length });
    var liste = el("uebersicht");
    liste.textContent = "";
    reihenfolge.forEach(function (idx) {
      var f = DATEN.faelle[idx];
      var li = document.createElement("li");
      li.lang = "en";
      var k = document.createElement("span");
      k.className = "ktx";
      k.textContent = f.kontext || "";
      var t = document.createElement("span");
      t.textContent = f.text;
      var l = document.createElement("span");
      l.className = "loes";
      l.textContent = katName(f.loesung) + ": " + f.erklaerungen[f.loesung];
      li.appendChild(k);
      li.appendChild(t);
      li.appendChild(l);
      liste.appendChild(li);
    });
    el("endeTitel").focus();
    meldeHoehe();
  }

  function start(mitAnsage) {
    reihenfolge = DATEN.faelle.map(function (_, i) { return i; });
    mische(reihenfolge);
    zustand = reihenfolge.map(function () {
      return { versuche: [], geloest: false, begr: "", meldung: "", art: "" };
    });
    pos = 0;
    treffer = 0;
    ende.classList.add("versteckt");
    spiel.classList.remove("versteckt");
    zeigeFall(mitAnsage);
    if (mitAnsage) { melde(T.gestartet); }
  }

  weiterKnopf.addEventListener("click", function () {
    if (pos < reihenfolge.length - 1) { pos++; zeigeFall(true); } else { zeigeEnde(); }
  });
  zurueckKnopf.addEventListener("click", function () {
    if (pos > 0) { pos--; zeigeFall(true); }
  });
  zurueckEndeKnopf.addEventListener("click", function () {
    ende.classList.add("versteckt");
    spiel.classList.remove("versteckt");
    pos = reihenfolge.length - 1;
    zeigeFall(true);
  });
  begr.addEventListener("input", function () { zustand[pos].begr = begr.value; });
  neuKnopf.addEventListener("click", function () { start(true); });
  window.addEventListener("load", meldeHoehe);
  window.addEventListener("resize", meldeHoehe);

  start(false);
})();
</script>
</body>
</html>
